# Compila eCord para Windows, Linux y macOS y publica todo en UN release de GitHub,
# con los archivos que necesita el actualizador automático (src/updater.rs).
#
#   * Tag `v*` (git tag v0.1.0 && git push origin v0.1.0) -> compila todo y crea el release.
#   * A mano (Actions > Release > Run workflow):
#       - con "tag" -> compila y crea/actualiza ese release;
#       - sin "tag" -> solo compila y deja los archivos como artefactos.
#
# Requisitos para publicar (ver packaging/ACTUALIZACIONES.md):
#   1. REPOSITORY en src/updater.rs = este repo (dueño/nombre).
#   2. assets/update-public-key.hex = clave pública Ed25519 (64 hex).
#   3. Secreto del repo ECORD_UPDATE_KEY = clave privada PEM correspondiente.
#   El job "Versión" lo comprueba todo ANTES de gastar una hora compilando.
#
# Archivos del release (los nombres los fija el actualizador, no los cambies):
#   Todos los paquetes con auto-actualización llevan `ecord-updater` junto a `ecord`: el ejecutable
#   aparte que instala las actualizaciones (src/bin/ecord-updater.rs).
#   Windows : ecord-vX-x86_64-pc-windows-msvc.zip        (portable, se actualiza solo)
#             ecord-vX-x86_64-pc-windows-msvc-setup.exe  (instalador por usuario, se actualiza solo)
#             ecord-vX-ffmpeg-gpl-x86_64-pc-windows-msvc.zip  (OPCIONAL: DLL de FFmpeg con libx264/GPL;
#                                                   la app lo ofrece bajar tras aceptar la licencia GPL)
#   Linux   : ecord-vX-x86_64-unknown-linux-gnu.tar.gz   (portable con FFmpeg, se actualiza solo)
#             ecord-vX-linux-amd64.deb                   (FFmpeg incluido; lo actualiza apt/dpkg, no la app)
#   macOS   : ecord-vX-macos-universal.dmg               (arm64 + x86_64, experimental)
#   Todos   : checksums.txt + checksums.txt.sig          (SHA-256 firmado con Ed25519)
#
# DeepFilterNet (supresión de ruido): `deepfilter-rt` carga ONNX Runtime EN EJECUCIÓN
# (load-dynamic, no se ve con ldd ni con dylibbundler), así que su biblioteca tiene que
# viajar en cada paquete: onnxruntime.dll junto al .exe (Windows) y libonnxruntime.so en
# lib/ (.tar.gz) o /usr/lib/ecord (.deb). La versión (ORT_VERSION) debe coincidir con la de
# vendor/deepfilter-rt/build.rs. El modelo (dfn3) se descarga en el primer uso.
# En macOS va como libonnxruntime.dylib en Contents/Resources (arm64 + x86_64 unidas con lipo).
#
# Por qué un runner por sistema y no cross-compile: el proyecto enlaza FFmpeg,
# WebKitGTK/WebView2, ALSA/Pulse y BoringSSL (nasm/cmake). Todo eso se compila
# mucho más fácil de forma nativa.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag del release (p. ej. v0.1.0). Vacío = solo compilar, sin release."
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # Igual que ORT_VERSION en vendor/deepfilter-rt/build.rs.
  ORT_VERSION: "1.23.2"

jobs:
  # ---------------------------------------------------------------- versión
  meta:
    name: Versión y configuración del actualizador
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$REF_TYPE" = tag ]; then v="$REF_NAME"; rel=true
          elif [ -n "$INPUT_TAG" ]; then v="$INPUT_TAG"; rel=true
          else v="dev-${GITHUB_SHA::7}"; rel=false; fi
          echo "version=$v"  >> "$GITHUB_OUTPUT"
          echo "release=$rel" >> "$GITHUB_OUTPUT"
          # El .deb y el actualizador toman la versión de Cargo.toml: tiene que coincidir con el tag.
          if [ "$rel" = true ]; then
            cargo_v=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
            if [ "v$cargo_v" != "$v" ]; then
              echo "::error::El tag es $v pero Cargo.toml dice version = \"$cargo_v\". Subí la versión en Cargo.toml."
              exit 1
            fi
          fi

      # Falla rápido si el actualizador quedaría roto en el release.
      - name: Comprobar configuración del actualizador
        if: steps.v.outputs.release == 'true'
        env:
          ECORD_UPDATE_KEY: ${{ secrets.ECORD_UPDATE_KEY }}
        run: |
          set -euo pipefail

          repo=$(grep -m1 'pub const REPOSITORY' src/updater.rs | cut -d'"' -f2)
          if [ "${repo,,}" != "${GITHUB_REPOSITORY,,}" ]; then
            echo "::error file=src/updater.rs::REPOSITORY = \"$repo\", pero el release se publica en \"$GITHUB_REPOSITORY\". Las copias instaladas buscarían actualizaciones en otro repo."
            exit 1
          fi

          pub=$(tr -d ' \r\n' < assets/update-public-key.hex)
          if ! [[ "$pub" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "::error file=assets/update-public-key.hex::La clave pública no son 64 caracteres hexadecimales (¿sigue el texto de ejemplo?)."
            exit 1
          fi

          if [ -z "$ECORD_UPDATE_KEY" ]; then
            echo "::error::Falta el secreto ECORD_UPDATE_KEY (clave privada Ed25519 en PEM). Sin él el release no se puede firmar y las copias instaladas lo rechazarían."
            exit 1
          fi
          key="$RUNNER_TEMP/k.pem"
          (umask 077; printf '%s\n' "$ECORD_UPDATE_KEY" > "$key")
          trap 'rm -f "$key"' EXIT
          derived=$(openssl pkey -in "$key" -pubout -outform DER | tail -c 32 | od -An -v -tx1 | tr -d ' \n')
          if [ "${derived,,}" != "${pub,,}" ]; then
            echo "::error::ECORD_UPDATE_KEY no corresponde a assets/update-public-key.hex. Firmarías releases que las copias instaladas rechazan."
            exit 1
          fi
          echo "Actualizador OK: repo=$repo, la clave privada coincide con la pública."

  # ---------------------------------------------------------------- Windows
  windows:
    name: Windows x64
    needs: meta
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      # Triple que usa el actualizador en los nombres de archivo.
      TARGET: x86_64-pc-windows-msvc
      # FFmpeg de BtbN (build "shared" LGPL con include/ lib/ bin/).
      FFMPEG_ASSET: ffmpeg-n8.1-latest-win64-lgpl-shared-8.1
      FFMPEG_DIR: C:\ffmpeg
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Caché de FFmpeg
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.FFMPEG_DIR }}
          key: ${{ env.FFMPEG_ASSET }}

      - name: Descargar FFmpeg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/$env:FFMPEG_ASSET.zip"
          $zip = Join-Path $env:RUNNER_TEMP "ffmpeg.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing
          $tmp = "C:\ffmpeg_tmp"
          Expand-Archive -Path $zip -DestinationPath $tmp -Force
          $inner = Get-ChildItem $tmp -Directory | Select-Object -First 1
          Move-Item $inner.FullName $env:FFMPEG_DIR
          Remove-Item $tmp -Recurse -Force -ErrorAction SilentlyContinue

      - name: Verificar FFmpeg
        shell: pwsh
        run: |
          foreach ($f in @("include\libavcodec\avcodec.h", "lib\avcodec.lib")) {
            if (-not (Test-Path "$env:FFMPEG_DIR\$f")) { throw "Falta $f en $env:FFMPEG_DIR" }
          }
          if (-not (Get-ChildItem "$env:FFMPEG_DIR\bin" -Filter "avcodec-*.dll")) { throw "Faltan las DLL en $env:FFMPEG_DIR\bin" }

      # ONNX Runtime para DeepFilterNet. Se deja en la carpeta donde lo busca build.rs
      # (así no lo vuelve a bajar) y de ahí se copia a los paquetes.
      - name: Caché de ONNX Runtime
        id: ort-cache
        uses: actions/cache@v4
        with:
          path: vendor/deepfilter-rt/onnxruntime-win-x64-${{ env.ORT_VERSION }}
          key: onnxruntime-win-x64-${{ env.ORT_VERSION }}

      - name: Descargar ONNX Runtime
        if: steps.ort-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $name = "onnxruntime-win-x64-$env:ORT_VERSION"
          $url = "https://github.com/microsoft/onnxruntime/releases/download/v$env:ORT_VERSION/$name.zip"
          $zip = Join-Path $env:RUNNER_TEMP "ort.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing
          Expand-Archive -Path $zip -DestinationPath vendor\deepfilter-rt -Force

      - name: Verificar ONNX Runtime
        shell: pwsh
        run: |
          $dll = "vendor\deepfilter-rt\onnxruntime-win-x64-$env:ORT_VERSION\lib\onnxruntime.dll"
          if (-not (Test-Path $dll)) { throw "Falta $dll" }
          "ORT_DLL=$((Resolve-Path $dll).Path)" >> $env:GITHUB_ENV
          Get-Item $dll | Format-Table Name, Length

      - name: Herramientas y entorno de compilación
        shell: pwsh
        run: |
          $nasm = Get-Command nasm -ErrorAction SilentlyContinue
          if (-not $nasm) {
            choco install nasm -y --no-progress
            $env:Path += ";C:\Program Files\NASM"
            "C:\Program Files\NASM" >> $env:GITHUB_PATH
            $nasm = Get-Command nasm
          }
          "ASM_NASM=$($nasm.Source)" >> $env:GITHUB_ENV
          "CMAKE_ASM_NASM_COMPILER=$($nasm.Source)" >> $env:GITHUB_ENV

          $llvm = "C:\Program Files\LLVM\bin"
          if (-not (Test-Path "$llvm\libclang.dll")) { choco install llvm -y --no-progress }
          if (-not (Test-Path "$llvm\libclang.dll")) { throw "No se encontró libclang.dll en $llvm" }
          "LIBCLANG_PATH=$llvm" >> $env:GITHUB_ENV

          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) { choco install ninja -y --no-progress }
          "CMAKE_GENERATOR=Ninja" >> $env:GITHUB_ENV

          $ffInclude = "$env:FFMPEG_DIR\include"
          "INCLUDE=$ffInclude;$env:INCLUDE" >> $env:GITHUB_ENV
          "$env:FFMPEG_DIR\bin" >> $env:GITHUB_PATH

          $inc = $env:INCLUDE -split ';' | Where-Object { $_ }
          $msvcInc = $inc | Where-Object { $_ -match 'VC\\Tools\\MSVC' } | Select-Object -First 1
          $sdkInc  = $inc | Where-Object { $_ -match 'Windows Kits' }
          $clangArgs = @(
            '-fms-extensions', '-fms-compatibility', '-fdelayed-template-parsing',
            '-D_CRT_SECURE_NO_WARNINGS', '-D_WIN32', '-D_WIN64', '-D_WIN32_WINNT=0x0A00',
            '-DHAVE_UNISTD_H=0', "-I`"$ffInclude`""
          )
          if ($msvcInc) { $clangArgs += "-I`"$msvcInc`"" }
          foreach ($p in $sdkInc) { $clangArgs += "-I`"$p`"" }
          "BINDGEN_EXTRA_CLANG_ARGS=$($clangArgs -join ' ')" >> $env:GITHUB_ENV

      - name: cargo build --release
        shell: pwsh
        run: |
          cargo build --release --locked
          if ($LASTEXITCODE -ne 0) { throw "cargo build falló" }
          # Los tres ejecutables van en el instalador (binaries en [package.metadata.packager]).
          # ecord-updater: quien instala las actualizaciones (src/bin/ecord-updater.rs).
          foreach ($bin in "ecord", "ecord-captcha", "ecord-updater") {
            if (-not (Test-Path "target\release\$bin.exe")) { throw "Falta $bin.exe" }
          }

      # ---- Instaladores ----
      - name: Instalar cargo-packager
        run: cargo install cargo-packager --locked

      - name: DLLs de FFmpeg, avisos de licencias y marcador del instalador
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force packaging\bundle-libs | Out-Null
          Copy-Item "$env:FFMPEG_DIR\bin\*.dll" packaging\bundle-libs
          # ecord-captcha.exe y ecord-updater.exe ya los instala cargo-packager como binarios
          # (Cargo.toml): no se copian también acá, o quedarían duplicados.
          # Avisos de licencias: viajan junto al .exe (instalador y zip portable).
          New-Item -ItemType Directory -Force packaging\notices | Out-Null
          Copy-Item THIRD_PARTY_NOTICES.md packaging\notices\
          Copy-Item LICENSE packaging\notices\LICENSE.txt
          Copy-Item assets\fonts\Inter-LICENSE.txt, assets\fonts\NotoEmoji-LICENSE.txt packaging\notices\
          Copy-Item assets\icons\LICENSE.txt packaging\notices\Lucide-LICENSE.txt
          if (Test-Path "$env:FFMPEG_DIR\LICENSE.txt") { Copy-Item "$env:FFMPEG_DIR\LICENSE.txt" packaging\notices\FFmpeg-LICENSE.txt }
          # ONNX Runtime (DeepFilterNet): la DLL y su licencia.
          Copy-Item $env:ORT_DLL packaging\bundle-libs\
          $ortRoot = Split-Path (Split-Path $env:ORT_DLL -Parent) -Parent
          if (Test-Path "$ortRoot\LICENSE") { Copy-Item "$ortRoot\LICENSE" packaging\notices\ONNXRuntime-LICENSE.txt }
          Copy-Item packaging\notices\* packaging\bundle-libs\
          # Marcador que le dice al actualizador "esto es una copia instalada por el
          # instalador": sin él, esa copia no se actualiza sola. Solo va en el instalador;
          # el zip portable lleva ecord-portable.txt (más abajo).
          Copy-Item packaging\ecord-installer.txt packaging\bundle-libs\

      - name: Generar .exe (setup)
        shell: pwsh
        run: |
          cargo packager --release --formats nsis -vv
          if ($LASTEXITCODE -ne 0) { throw "cargo packager falló (código $LASTEXITCODE)" }
          if (-not (Test-Path dist-installers)) {
            throw "cargo packager no creó dist-installers. ¿Está [package.metadata.packager] en el Cargo.toml commiteado?"
          }
          Write-Host "Contenido de dist-installers:"
          Get-ChildItem dist-installers -Recurse | Format-Table FullName, Length

      - name: Reunir archivos
        shell: pwsh
        run: |
          $n = "ecord-$env:VERSION-$env:TARGET"
          New-Item -ItemType Directory -Force dist | Out-Null
          $exe = Get-ChildItem dist-installers -Recurse -Filter *-setup.exe | Select-Object -First 1
          if (-not $exe) { throw "No se generó el instalador -setup.exe en dist-installers (mirá el paso anterior)" }
          # El .exe (NSIS) instala por usuario, sin elevación: es el que usa el actualizador.
          Copy-Item $exe.FullName "dist\$n-setup.exe"
          # ZIP portable: carpeta ecord-vX-<target>\ con ecord.exe, DLLs y ecord-portable.txt.
          $stage = "stage\$n"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item target\release\ecord.exe $stage
          Copy-Item target\release\ecord-captcha.exe $stage
          Copy-Item target\release\ecord-updater.exe $stage
          Copy-Item "$env:FFMPEG_DIR\bin\*.dll" $stage
          Copy-Item $env:ORT_DLL $stage
          Copy-Item packaging\notices\* $stage
          Copy-Item packaging\ecord-portable.txt $stage
          if (-not (Test-Path "$stage\onnxruntime.dll")) { throw "El zip portable no lleva onnxruntime.dll" }
          # El actualizador instala estas DLL junto con el .exe (UPDATES.libraries): tienen que
          # ir sueltas en la carpeta del zip, no en una subcarpeta.
          if (-not (Get-ChildItem $stage -Filter "avcodec-*.dll")) { throw "El zip portable no lleva las DLL de FFmpeg" }
          if (-not (Test-Path "$stage\ecord-updater.exe")) { throw "El zip portable no lleva ecord-updater.exe" }
          Compress-Archive -Path $stage -DestinationPath "dist\$n.zip" -Force
          Get-ChildItem dist | Format-Table Name, Length

      # ---- Paquete opcional FFmpeg GPL (libx264) ----
      # NO va dentro del instalador ni del zip portable (eCord es MIT y su FFmpeg es LGPL).
      # Es un archivo aparte del release que la app ofrece bajar tras mostrar el aviso de la
      # licencia GPL (src/gpl_pack.rs). Mismas DLL y misma versión de FFmpeg que las LGPL,
      # pero compiladas con --enable-gpl --enable-libx264, así que se pueden intercambiar.
      # El nombre lo fija gpl_pack::asset_name(); entra solo en checksums.txt (ecord-v*),
      # que va firmado: la app verifica firma y SHA-256 antes de instalar.
      - name: Paquete FFmpeg GPL (libx264)
        shell: pwsh
        env:
          FFMPEG_GPL_ASSET: ffmpeg-n8.1-latest-win64-gpl-shared-8.1
        run: |
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/$env:FFMPEG_GPL_ASSET.zip"
          $zip = Join-Path $env:RUNNER_TEMP "ffmpeg-gpl.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing
          $tmp = "C:\ffmpeg_gpl_tmp"
          Expand-Archive -Path $zip -DestinationPath $tmp -Force
          $inner = Get-ChildItem $tmp -Directory | Select-Object -First 1
          $bin = Join-Path $inner.FullName "bin"

          # Tienen que ser LAS MISMAS DLL (nombres y versión mayor) que las LGPL con las que se
          # compiló eCord; si no, intercambiarlas rompería el arranque.
          $lgpl = (Get-ChildItem "$env:FFMPEG_DIR\bin" -Filter *.dll).Name | Sort-Object
          $gpl  = (Get-ChildItem $bin -Filter *.dll).Name | Sort-Object
          $diff = Compare-Object $lgpl $gpl
          if ($diff) { $diff | Format-Table; throw "Las DLL GPL no coinciden con las LGPL (otra versión de FFmpeg)" }

          $pack = "stage-gpl"
          New-Item -ItemType Directory -Force $pack | Out-Null
          Copy-Item "$bin\*.dll" $pack
          Copy-Item (Join-Path $inner.FullName "LICENSE.txt") "$pack\FFmpeg-GPL-LICENSE.txt"
          @"
          eCord - paquete opcional FFmpeg GPL (libx264)
          =============================================
          Estas DLL son FFmpeg compilado con --enable-gpl --enable-libx264 (compilacion de BtbN).
          Se distribuyen bajo la GNU GPL (v2 o posterior; ver FFmpeg-GPL-LICENSE.txt).
          eCord en si es MIT y NO incluye estas DLL: se bajan aparte y solo si las aceptas.

          Codigo fuente y scripts de compilacion:
            FFmpeg : https://ffmpeg.org/download.html  (https://git.ffmpeg.org/ffmpeg.git)
            x264   : https://code.videolan.org/videolan/x264
            Build  : https://github.com/BtbN/FFmpeg-Builds  (compilacion: $env:FFMPEG_GPL_ASSET)

          Para volver a las DLL LGPL originales, restaura los archivos *.lgpl-bak junto a ecord.exe.
          "@ | Set-Content -Encoding utf8 "$pack\README-GPL.txt"

          Compress-Archive -Path "$pack\*" -DestinationPath "dist\ecord-$env:VERSION-ffmpeg-gpl-$env:TARGET.zip" -Force
          Get-ChildItem dist | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: ecord-${{ env.VERSION }}-windows-x64
          path: dist/*
          if-no-files-found: error

  # ---------------------------------------------------------------- Linux
  # FFmpeg (compilación de BtbN) viaja dentro de los dos paquetes:
  #   * .deb          -> /usr/lib/ecord, el binario lo encuentra por rpath. Lo actualiza apt.
  #   * .tar.gz       -> carpeta lib/ junto al ejecutable (rpath $ORIGIN/lib). Es el que se
  #                      actualiza solo desde la app (lleva ecord-portable.txt).
  # Se compila en Ubuntu 22.04 (glibc 2.35) para que corra también en distros nuevas.
  linux:
    name: Linux x64 (.deb y .tar.gz con FFmpeg incluido)
    needs: meta
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    timeout-minutes: 120
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      TARGET: x86_64-unknown-linux-gnu
      DEBIAN_FRONTEND: noninteractive
      # GPL = trae libx264 (transmitir pantalla por software). Para una build
      # LGPL, sin x264, cambiá "gpl" por "lgpl": el cliente usa entonces libopenh264.
      FFMPEG_ASSET: ffmpeg-n8.1-latest-linux64-gpl-shared-8.1
      FFMPEG_DIR: /opt/ffmpeg
      # Dónde buscará el binario las .so de FFmpeg una vez instalado el .deb.
      RUSTFLAGS: -C link-arg=-Wl,-rpath,/usr/lib/ecord
    steps:
      # Sin libav*-dev a propósito: FFmpeg sale del paquete de BtbN, no del sistema.
      - name: Dependencias del sistema
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git xz-utils patchelf \
            build-essential cmake nasm pkg-config clang libclang-dev llvm dpkg-dev \
            libasound2-dev libpulse-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev

      - uses: actions/checkout@v4

      - name: Instalar Rust
        run: |
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-bundled-ffmpeg

      - name: Descargar FFmpeg
        run: |
          curl -fL --retry 3 -o /tmp/ffmpeg.tar.xz \
            "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/${FFMPEG_ASSET}.tar.xz"
          mkdir -p "$FFMPEG_DIR"
          tar -xJf /tmp/ffmpeg.tar.xz -C "$FFMPEG_DIR" --strip-components=1
          test -f "$FFMPEG_DIR/include/libavcodec/avcodec.h"
          ls -l "$FFMPEG_DIR/lib" | head -40

      # ONNX Runtime para DeepFilterNet, en la carpeta donde lo busca build.rs.
      - name: Caché de ONNX Runtime
        id: ort-cache
        uses: actions/cache@v4
        with:
          path: vendor/deepfilter-rt/onnxruntime-linux-x64-${{ env.ORT_VERSION }}
          key: onnxruntime-linux-x64-${{ env.ORT_VERSION }}

      - name: Descargar ONNX Runtime
        if: steps.ort-cache.outputs.cache-hit != 'true'
        run: |
          name="onnxruntime-linux-x64-${ORT_VERSION}"
          curl -fL --retry 3 -o /tmp/ort.tgz \
            "https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VERSION}/${name}.tgz"
          tar -xzf /tmp/ort.tgz -C vendor/deepfilter-rt
          test -e "vendor/deepfilter-rt/${name}/lib/libonnxruntime.so"

      - name: cargo build --release
        run: cargo build --release --locked

      - name: Preparar las bibliotecas de FFmpeg para el paquete
        run: |
          mkdir -p packaging/linux/ffmpeg-libs
          # Solo los archivos con el nombre "soname" (libavcodec.so.62), copiando el
          # contenido real: evita meter tres copias de cada biblioteca.
          find "$FFMPEG_DIR/lib" -maxdepth 1 -regextype posix-extended \
            -regex '.*/lib[a-z0-9_]+\.so\.[0-9]+' | while read -r f; do
            cp -L "$f" "packaging/linux/ffmpeg-libs/$(basename "$f")"
          done
          # Que las bibliotecas se encuentren entre sí dentro de /usr/lib/ecord.
          patchelf --set-rpath '$ORIGIN' packaging/linux/ffmpeg-libs/*.so.*
          # ONNX Runtime (DeepFilterNet), con el nombre exacto que busca deepfilter-rt.
          # Va en la misma carpeta que FFmpeg: /usr/lib/ecord en el .deb y lib/ en el .tar.gz.
          ort="vendor/deepfilter-rt/onnxruntime-linux-x64-${ORT_VERSION}"
          cp -L "$ort/lib/libonnxruntime.so" packaging/linux/ffmpeg-libs/libonnxruntime.so
          cp "$ort/LICENSE" packaging/linux/onnxruntime-LICENSE.txt
          ls -l packaging/linux/ffmpeg-libs
          cp "$FFMPEG_DIR/LICENSE.txt" packaging/linux/ffmpeg-LICENSE.txt 2>/dev/null \
            || echo "FFmpeg (compilación GPL de BtbN): https://ffmpeg.org/legal.html" > packaging/linux/ffmpeg-LICENSE.txt

      # Instala las .so donde las buscará el binario, para que dpkg-shlibdeps (cargo-deb)
      # las encuentre al calcular las dependencias, y comprueba que no falte ninguna.
      - name: Comprobar enlaces
        run: |
          mkdir -p /usr/lib/ecord
          cp packaging/linux/ffmpeg-libs/* /usr/lib/ecord/
          ldd target/release/ecord | tee /tmp/ldd.txt
          # `ecord` no debe depender de WebKit/GTK: eso es solo de `ecord-captcha`.
          if grep -qE "webkit|libgtk|libsoup|javascriptcore" /tmp/ldd.txt; then
            echo "::error::ecord enlaza WebKit/GTK; tiene que ir solo en ecord-captcha"; exit 1
          fi
          test -x target/release/ecord-captcha
          # libonnxruntime.so (DeepFilterNet) se carga con dlopen: ldd del ejecutable no la ve.
          test -f /usr/lib/ecord/libonnxruntime.so
          for f in /usr/lib/ecord/*.so.* /usr/lib/ecord/libonnxruntime.so; do echo "== $f"; ldd "$f"; done | tee -a /tmp/ldd.txt
          if grep -q "not found" /tmp/ldd.txt; then
            echo "::error::Hay bibliotecas sin resolver"; grep -B1 "not found" /tmp/ldd.txt; exit 1
          fi

      - name: Generar .deb
        run: |
          RUSTFLAGS= cargo install cargo-deb --locked
          cargo deb --no-build --variant bundled
          mkdir -p dist
          cp target/debian/*.deb "dist/ecord-${VERSION}-linux-amd64.deb"
          dpkg-deb --info dist/*.deb
          dpkg-deb --field dist/*.deb Depends | grep -q libwebkit2gtk-4.1-0 \
            || { echo "::error::El Depends del .deb no incluye WebKitGTK"; exit 1; }
          dpkg-deb --contents dist/*.deb | grep -E "usr/bin|usr/lib/ecord"
          dpkg-deb --contents dist/*.deb | grep -q "usr/lib/ecord/ecord-captcha" \
            || { echo "::error::El .deb no incluye ecord-captcha"; exit 1; }

      # Portable: el que el actualizador sabe reemplazar. Carpeta ecord-vX-<target>/ con el
      # ejecutable `ecord`, ecord-portable.txt a su lado y las .so de FFmpeg en lib/.
      # El .deb NO lleva el marcador: lo gestiona apt.
      - name: Generar .tar.gz portable
        run: |
          N="ecord-${VERSION}-${TARGET}"
          mkdir -p "stage/$N/lib" dist
          # Copia del binario con otro rpath; el de target/release (para el .deb) no se toca.
          cp target/release/ecord "stage/$N/ecord"
          # Ventana del captcha (necesita WebKitGTK del sistema; `ecord` arranca sin él).
          cp target/release/ecord-captcha "stage/$N/ecord-captcha"
          # Ayudante que instala las actualizaciones (no enlaza FFmpeg; no necesita rpath).
          cp target/release/ecord-updater "stage/$N/ecord-updater"
          patchelf --set-rpath '$ORIGIN/lib' "stage/$N/ecord"
          cp packaging/linux/ffmpeg-libs/* "stage/$N/lib/"
          cp packaging/ecord-portable.txt "stage/$N/"
          cp THIRD_PARTY_NOTICES.md "stage/$N/"
          cp LICENSE "stage/$N/LICENSE.txt"
          cp assets/fonts/Inter-LICENSE.txt assets/fonts/NotoEmoji-LICENSE.txt "stage/$N/"
          cp assets/icons/LICENSE.txt "stage/$N/Lucide-LICENSE.txt"
          cp packaging/linux/ffmpeg-LICENSE.txt "stage/$N/FFmpeg-LICENSE.txt"
          cp packaging/linux/onnxruntime-LICENSE.txt "stage/$N/ONNXRuntime-LICENSE.txt"
          test -f "stage/$N/lib/libonnxruntime.so"
          # Que el ejecutable portable encuentre FFmpeg en lib/ (y no en /usr/lib/ecord).
          ldd "stage/$N/ecord" | tee /tmp/ldd-portable.txt
          if grep -q "not found" /tmp/ldd-portable.txt; then
            echo "::error::El portable tiene bibliotecas sin resolver"; grep -B1 "not found" /tmp/ldd-portable.txt; exit 1
          fi
          tar -C stage -czf "dist/$N.tar.gz" "$N"
          tar -tzf "dist/$N.tar.gz" | head -30
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: ecord-${{ env.VERSION }}-linux-amd64
          path: dist/*
          if-no-files-found: error

  # Instala el .deb en distros limpias y mira si queda alguna biblioteca sin resolver
  # (en el .deb y en el .tar.gz portable). Informa, pero no bloquea el release.
  linux-verify:
    name: Verificar paquetes en ${{ matrix.image }}
    needs: [meta, linux]
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    continue-on-error: true
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        image:
          - ubuntu:22.04
          - ubuntu:24.04
          - debian:bookworm
          - debian:trixie
          - kalilinux/kali-rolling
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ecord-${{ needs.meta.outputs.version }}-linux-amd64
          path: dist
      - name: Instalar el .deb
        run: |
          apt-get update
          apt-get install -y ./dist/*.deb
      - name: Comprobar bibliotecas del .deb
        run: |
          ldd /usr/bin/ecord | tee /tmp/ldd.txt
          for f in /usr/lib/ecord/*.so.* /usr/lib/ecord/libonnxruntime.so; do echo "== $f"; ldd "$f"; done | tee -a /tmp/ldd.txt
          if grep -q "not found" /tmp/ldd.txt; then
            echo "::error::Faltan bibliotecas en ${{ matrix.image }}"; grep -B1 "not found" /tmp/ldd.txt; exit 1
          fi
      # Las dependencias del sistema ya las trajo el .deb; el portable usa las mismas.
      - name: Comprobar el .tar.gz portable
        run: |
          mkdir -p /tmp/portable
          tar -xzf dist/*.tar.gz -C /tmp/portable
          exe=$(echo /tmp/portable/*/ecord)
          test -f "$(dirname "$exe")/ecord-portable.txt"
          ldd "$exe" | tee /tmp/ldd-portable.txt
          if grep -q "not found" /tmp/ldd-portable.txt; then
            echo "::error::El portable tiene bibliotecas sin resolver en ${{ matrix.image }}"; grep -B1 "not found" /tmp/ldd-portable.txt; exit 1
          fi
          # El helper del captcha sí usa WebKitGTK: aquí ya lo trajo el .deb. Solo informa.
          ldd "$(dirname "$exe")/ecord-captcha" | tee /tmp/ldd-captcha.txt
          if grep -q "not found" /tmp/ldd-captcha.txt; then
            echo "::warning::ecord-captcha tiene bibliotecas sin resolver en ${{ matrix.image }}"; grep "not found" /tmp/ldd-captcha.txt
          fi

  # ---------------------------------------------------------------- macOS
  # El actualizador espera UN .dmg universal (ecord-vX-macos-universal.dmg). Se compila
  # una vez por arquitectura (cada una con su Homebrew y su FFmpeg) y un job aparte las
  # une con lipo. Experimental: si falla, no bloquea Windows/Linux (pero ese release
  # saldrá sin .dmg).
  # DeepFilterNet: ONNX Runtime 1.23.x no publica un build `osx-x64`, así que el job Intel
  # usa el `universal2` (y se queda con su parte x86_64); el de Apple Silicon usa `osx-arm64`.
  # Cada job deja su libonnxruntime.dylib en out/libs, y el job `macos` las une con lipo
  # igual que a las de FFmpeg. deepfilter-rt la busca en Contents/Resources.
  macos-build:
    name: macOS ${{ matrix.arch }} (compilación)
    needs: meta
    runs-on: ${{ matrix.runner }}
    continue-on-error: true
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: arm64,  runner: macos-14,       ort: osx-arm64 }
          - { arch: x86_64, runner: macos-15-intel, ort: osx-universal2 }
    steps:
      - uses: actions/checkout@v4

      - name: Dependencias
        run: |
          brew install ffmpeg@7 nasm cmake pkg-config dylibbundler
          echo "PKG_CONFIG_PATH=$(brew --prefix ffmpeg@7)/lib/pkgconfig" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-${{ matrix.arch }}

      # ONNX Runtime para DeepFilterNet, en la carpeta donde lo busca build.rs.
      - name: Caché de ONNX Runtime
        id: ort-cache
        uses: actions/cache@v4
        with:
          path: vendor/deepfilter-rt/onnxruntime-${{ matrix.ort }}-${{ env.ORT_VERSION }}
          key: onnxruntime-${{ matrix.ort }}-${{ env.ORT_VERSION }}

      - name: Descargar ONNX Runtime
        if: steps.ort-cache.outputs.cache-hit != 'true'
        run: |
          name="onnxruntime-${{ matrix.ort }}-${ORT_VERSION}"
          curl -fL --retry 3 -o "$RUNNER_TEMP/ort.tgz" \
            "https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VERSION}/${name}.tgz"
          tar -xzf "$RUNNER_TEMP/ort.tgz" -C vendor/deepfilter-rt
          test -f "vendor/deepfilter-rt/${name}/lib/libonnxruntime.dylib"

      - name: cargo build --release
        run: cargo build --release --locked

      # Mete las dylibs de FFmpeg junto al binario para no exigirle Homebrew al usuario.
      - name: Embeber dylibs
        run: |
          mkdir -p packaging/bundle-libs out
          dylibbundler -od -b -x target/release/ecord \
            -d packaging/bundle-libs -p @executable_path/../Resources/
          cp target/release/ecord out/ecord
          cp -R packaging/bundle-libs out/libs
          file out/ecord

      # ONNX Runtime (DeepFilterNet) se carga con dlopen: dylibbundler no la ve, hay que
      # copiarla a mano. Cada job deja SOLO su arquitectura, para que el lipo del job
      # `macos` pueda unirlas (el universal2 del job Intel se recorta a x86_64).
      - name: Empaquetar ONNX Runtime
        run: |
          ort="vendor/deepfilter-rt/onnxruntime-${{ matrix.ort }}-${ORT_VERSION}"
          src="$ort/lib/libonnxruntime.dylib"
          test -f "$src"
          lipo -archs "$src"
          if [ "${{ matrix.arch }}" = x86_64 ]; then
            lipo -thin x86_64 "$src" -output out/libs/libonnxruntime.dylib
          else
            cp -L "$src" out/libs/libonnxruntime.dylib
          fi
          test "$(lipo -archs out/libs/libonnxruntime.dylib)" = "${{ matrix.arch }}"
          cp "$ort/LICENSE" out/ONNXRuntime-LICENSE.txt

      # Nombre `build-*` (no `ecord-*`) a propósito: el job de publicación sube todo lo
      # que empieza con `ecord-`, y esto son piezas intermedias.
      - uses: actions/upload-artifact@v4
        with:
          name: build-macos-${{ matrix.arch }}
          path: out
          if-no-files-found: error

  macos:
    name: macOS universal (.dmg, experimental)
    needs: [meta, macos-build]
    runs-on: macos-14
    continue-on-error: true   # que un fallo acá no frene Windows/Linux
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: build-macos-arm64
          path: parts/arm64
      - uses: actions/download-artifact@v4
        with:
          name: build-macos-x86_64
          path: parts/x86_64

      - uses: dtolnay/rust-toolchain@stable

      - name: Unir arm64 + x86_64 (lipo)
        run: |
          mkdir -p target/release packaging/bundle-libs
          lipo -create parts/arm64/ecord parts/x86_64/ecord -output target/release/ecord
          lipo -archs target/release/ecord

          # Cada dylib se une con su par. Si una solo existe en una arquitectura, se copia
          # tal cual: solo la carga el binario de esa arquitectura.
          for f in parts/arm64/libs/*.dylib parts/x86_64/libs/*.dylib; do
            b=$(basename "$f")
            [ -f "packaging/bundle-libs/$b" ] && continue
            if [ -f "parts/arm64/libs/$b" ] && [ -f "parts/x86_64/libs/$b" ]; then
              lipo -create "parts/arm64/libs/$b" "parts/x86_64/libs/$b" -output "packaging/bundle-libs/$b"
            else
              echo "::warning::$b existe en una sola arquitectura"
              cp "$f" "packaging/bundle-libs/$b"
            fi
          done
          ls -l packaging/bundle-libs

          # lipo invalida las firmas: firma de nuevo (ad-hoc), dylibs primero.
          for f in packaging/bundle-libs/*.dylib; do codesign --force --sign - "$f"; done
          codesign --force --sign - target/release/ecord

          # Avisos de licencias dentro de la app (mismo glob que las dylibs).
          cp THIRD_PARTY_NOTICES.md packaging/bundle-libs/
          cp LICENSE packaging/bundle-libs/LICENSE.txt
          cp assets/fonts/Inter-LICENSE.txt assets/fonts/NotoEmoji-LICENSE.txt packaging/bundle-libs/
          cp assets/icons/LICENSE.txt packaging/bundle-libs/Lucide-LICENSE.txt
          cp parts/arm64/ONNXRuntime-LICENSE.txt packaging/bundle-libs/
          # libonnxruntime.dylib (DeepFilterNet) ya quedó unida por el bucle de lipo de arriba.
          test "$(lipo -archs packaging/bundle-libs/libonnxruntime.dylib | tr ' ' '\n' | sort | tr '\n' ' ')" = "arm64 x86_64 "

      - name: Generar .dmg
        run: |
          cargo install cargo-packager --locked
          cargo packager --release --formats dmg
          mkdir -p dist
          cp dist-installers/*.dmg "dist/ecord-${VERSION}-macos-universal.dmg"
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: ecord-${{ env.VERSION }}-macos-universal
          path: dist/*
          if-no-files-found: error

  # ---------------------------------------------------------------- Release
  publish:
    name: Publicar release
    needs: [meta, windows, linux, macos]
    if: needs.meta.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      # Hace falta el repo para leer assets/update-public-key.hex al verificar la firma.
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: ecord-*
          merge-multiple: true
          path: dist

      # checksums.txt lista TODOS los archivos del release; la firma (Ed25519, cruda, 64
      # bytes) es lo que valida el actualizador antes de descargar nada.
      - name: Firmar checksums.txt
        env:
          ECORD_UPDATE_KEY: ${{ secrets.ECORD_UPDATE_KEY }}
        run: |
          set -euo pipefail
          cd dist
          ls -l
          sha256sum ecord-v* > checksums.txt
          cat checksums.txt

          key="$RUNNER_TEMP/ecord-update-key.pem"
          (umask 077; printf '%s\n' "$ECORD_UPDATE_KEY" > "$key")
          trap 'rm -f "$key" "$RUNNER_TEMP/ecord-update-pub.pem"' EXIT

          openssl pkeyutl -sign -rawin -inkey "$key" -in checksums.txt -out checksums.txt.sig
          test "$(stat -c %s checksums.txt.sig)" = 64

          # Comprobación con la clave pública que está EN EL REPO (la que lleva la app).
          pub=$(tr -d ' \r\n' < ../assets/update-public-key.hex)
          python3 -c 'import sys; sys.stdout.buffer.write(bytes.fromhex("302a300506032b6570032100" + sys.argv[1]))' "$pub" > "$RUNNER_TEMP/pub.der"
          openssl pkey -pubin -inform DER -in "$RUNNER_TEMP/pub.der" -out "$RUNNER_TEMP/ecord-update-pub.pem"
          openssl pkeyutl -verify -rawin -pubin -inkey "$RUNNER_TEMP/ecord-update-pub.pem" \
            -in checksums.txt -sigfile checksums.txt.sig
          echo "Firma verificada con assets/update-public-key.hex"

      - run: ls -l dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.version }}
          name: ecord ${{ needs.meta.outputs.version }}
          generate_release_notes: true
          prerelease: ${{ contains(needs.meta.outputs.version, '-') }}
          fail_on_unmatched_files: true
          files: dist/*