[package]
name = "ecord"
version = "0.0.10"
edition = "2024"
# bidi.rs y system_fonts.rs usan let-chains ("if let ... && ...", estabilizado
# en la edición 2024), así que hace falta un rustc razonablemente reciente.
rust-version = "1.88"

[dependencies]
web-local-storage-api = "0.0.0"
serde = { version = "1", features = ["derive"] }
# `raw_value`: gateway.rs/models.rs guardan el `d` de cada payload como texto
# (`RawValue`) y lo parsean directo a structs tipados, sin armar un árbol
# `Value` gigante para los `GUILD_CREATE`.
serde_json = { version = "1", features = ["raw_value"] }
# main.rs: allocator global. El de Windows (y el de glibc con tokio
# multihilo) casi nunca devuelve al sistema la memoria que un pico de parseo
# (READY/GUILD_CREATE de 100+ servers) dejó liberada: el RSS se queda en el
# pico. mimalloc la devuelve.
mimalloc = "0.1"
# support::mem_report: `mi_collect` para que mimalloc devuelva
# al sistema las páginas libres (baja el "Funcionamiento" con muchos servers).
libmimalloc-sys = { version = "0.1", features = ["extended"] }

eframe = { version = "0.36", default-features = false, features = ["accesskit", "glow", "default_fonts", "links", "wayland", "x11", "persistence"] }
egui = "0.36"
# theme.rs: install_image_loaders (image/svg para los íconos Lucide).
# `http` es el que faltaba para los avatares/íconos del CDN de Discord:
# sin él, `install_image_loaders` no registra ningún loader capaz de bajar
# una URL y egui tira "No matching BytesLoader" al intentar cargar
# https://cdn.discordapp.com/... Los otros loaders solo manejan bytes ya
# en memoria (`bytes://`, usado por el QR) o archivos locales.
# `gif` y `webp` agregan los loaders ANIMADOS (`GifLoader`/`WebPLoader`):
# sin ellos un GIF/WebP animado se dibuja congelado en el primer cuadro,
# y en un chat casi todo lo que mandan es un GIF (Tenor, Giphy, adjuntos).
egui_extras = { version = "0.36", features = ["image", "svg", "http", "file", "gif", "webp"] }
# El loader de `egui_extras` decodifica con la crate `image`, pero los
# formatos concretos dependen de los features de ESTA crate. Discord sirve
# los avatares como .png y, si son animados, .gif.
image = { version = "0.25", default-features = false, features = ["png", "gif", "jpeg", "webp", "bmp"] }
# theme.rs: fondo dinámico según el wallpaper del sistema (ThemeMode::Wallpaper).
# `wallpaper::get()` ubica el archivo del fondo de escritorio actual en
# Windows/macOS/GNOME/KDE/Cinnamon/XFCE/etc.
wallpaper = "3"
# theme.rs: color dominante del wallpaper ya decodificado (`sample_wallpaper_color_from_path`).
color-thief = "0.2"
# theme.rs: alinea el baseline de las fuentes fallback con Inter.
# system_fonts.rs: lee y rankea las fuentes instaladas en el sistema.
skrifa = "0.44"
memmap2 = "0.9"
# system_fonts.rs: ubica las carpetas de fuentes del sistema.
directories = "6"
# bidi.rs: soporte de texto RTL (árabe/hebreo).
unicode-bidi = "0.3"
# system_fonts.rs usa log::debug!/log::warn! (no hace falta inicializar
# ningún logger para que compile, pero si querés ver esos mensajes agregá
# env_logger u otro logger e inicializalo en main()).
log = "0.4"
env_logger = "0.11"

# --- Cliente real de Discord (src/discord/) ---
# Runtime async para el hilo de fondo que habla con la API REST y el
# Gateway; eframe/egui siguen corriendo sync en el hilo principal.
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "sync", "net"] }
# API REST (perfil, relaciones/amigos, guilds, canales, mensajes).
# default-features = false: quita `default-tls` (native-tls). En Linux eso arrastra
# OpenSSL, que choca al enlazar con BoringSSL (btls-sys/wreq). Usamos solo rustls.
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "blocking",       # http_cache.rs: descargas de imágenes en hilos aparte
    "cookies",        # sin esto, `reqwest::cookie::CookieStore` no existe
    "gzip",
    "brotli",         # el header Accept-Encoding pide `br`
    "zstd",           # ... y `zstd`
    "rustls-tls",     # (o `native-tls` si preferís OpenSSL/SChannel)
    "system-proxy",   # usa el proxy del sistema (también para HTTPS)
    "rustls-tls-native-roots",
    # los demás defaults de reqwest, sin `default-tls`:
    "http2",
    "charset",
    "macos-system-configuration",
] }
# 0.8 es la que depende de reqwest 0.12 y cookie_store 0.21 (la 0.10 pide
# reqwest 0.13 + cookie_store 0.22 y choca con las versiones de abajo).
reqwest_cookie_store = "0.8"   # implementa CookieStore sobre cookie_store
cookie_store = "0.21"          # el store en sí (save/load JSON)
uuid = { version = "1", features = ["v4"] }
iana-time-zone = "0.1.65"
chrono = "0.4"
toml = "0.8"
sys-locale = "0.3.2"
# `SinkExt`/`StreamExt` (split, send, next) sobre los WebSockets de `wreq`
# (src/discord/websocket.rs: Gateway, login por QR y voz).
futures-util = "0.3"
# discord/gateway.rs: el Gateway real de Discord manda todo comprimido en
# un único stream zlib de por vida de la conexión (`compress=zlib-stream`
# en la URL) — sin esto un `READY` grande (todos tus servers/amigos de
# una) puede superar el límite de un frame de WebSocket sin comprimir.
flate2 = "1"
# Login por QR: Discord manda claves/tickets cifrados con RSA-OAEP que hay
# que descifrar con la clave privada que genera el cliente.
rsa = "0.9"
sha2 = "0.10"
rand = "0.8"
base64 = "0.22"
# Generar el código QR (como SVG) que se muestra en la pantalla de login.
# `svg` es justamente el feature que renderiza a SVG en login.rs —
# `default-features = false` sin esto lo apaga y no compila.
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
# Manejo de errores cómodo en discord/{remote_auth,gateway}.rs.
anyhow = "1"

# --- Ventana del captcha (src/discord/captcha.rs) ---
# El captcha de hCaptcha que pide Discord en el login se resuelve en un
# WebView. Corre en un proceso hijo (este mismo ejecutable con
# `--captcha-window`) para no pelear con el event loop de eframe. En Windows
# usa WebView2 (viene con Edge / Windows 10+); en Linux hace falta
# libwebkit2gtk-4.1-dev y gtk3. Si cargo se queja de versiones cruzadas,
# `cargo update -p wry -p tao` o alinear ambas a las últimas compatibles.
wry = "0.47"
tao = "0.31"

# --- Proto de configuración de cuenta de Discord (src/discord/user_settings.rs) ---
# `PreloadedUserSettings`: tema, locale, status, notificaciones,
# privacidad, favoritos, etc., tal cual lo sincronizan entre sí los
# clientes oficiales (`GET/PATCH /users/@me/settings-proto/1`). El código
# del mensaje lo genera `build.rs` con `prost-build` a partir de
# `proto/discord_user_settings.proto`; acá solo hace falta el runtime
# (`prost::Message`, encode/decode) para poder usarlo.
prost = "0.13"
# El proto usa `google.protobuf.Timestamp` (guild_recents_dismissed_at,
# etc.) — prost-build genera esos campos como `::prost_types::Timestamp`,
# así que esta dependencia tiene que estar en runtime, no solo en build.rs.
prost-types = "0.13"

# --- Favoritos y frecency (src/discord/frecency.rs) ---
# Los emojis Unicode se guardan en la cuenta por su nombre de Discord
# (`joy`, `skull_crossbones`); esta crate da el mapeo emoji <-> shortcode.
emojis = "0.6"

# --- Reproductor de video embebido (ui/video_player.rs) ---
# Fork vendorizado de egui-video, portado a egui 0.36 (el original y el fork
# de Lxtharia dependen de egui 0.31 y chocan con el 0.36 de esta app).
# Decodifica con ffmpeg 6/7 (libs de desarrollo instaladas al compilar y
# libs dinámicas disponibles al ejecutar) y reproduce audio con cpal, así
# que ya no hace falta SDL2.
# Compilar en `--release` u `opt-level=3`: en debug la reproducción va lenta.
egui-video = { path = "vendor/egui-video" }
url = "2.5.8"
# Visor de streams (Go Live, src/discord/voice/video_decode.rs): decodifica el
# H.264 que llega por RTP. Misma crate y versión que usa `vendor/egui-video`,
# así que Cargo las unifica y no hay que instalar nada extra.
ffmpeg-the-third = "6.0.0"
# Transmitir pantalla (src/discord/voice/screen_capture.rs): captura (avdevice)
# y codificación H.264 en este mismo proceso con la misma crate de arriba, sin
# un `ffmpeg` aparte. Las libs de ffmpeg tienen que incluir `avdevice` y
# `libx264`. `libc` solo da `EAGAIN` para distinguirlo de un error real al
# leer del codificador (ya estaba en el árbol por `vendor/egui-video`).
libc = "0.2"

# --- REST "undetected" de UwUDev (vendorizado con su workspace completo:
# discord_client_structs/macros/utils como hermanos bajo vendor/) ---
# Ver src/discord/uwu_rest.rs para el wrapper que lo conecta con el login
# y con el fingerprint compartido de fingerprint.rs.
discord_client_rest = { path = "vendor/discord_client_rest" }
discord_client_structs = { path = "vendor/discord_client_structs" }
# `ws`: todos los WebSockets (Gateway, login por QR y voz, ver
# src/discord/websocket.rs) salen por wreq, con la misma huella TLS de Chrome que
# el REST. Reemplaza a tokio-tungstenite, que ya no es dependencia directa.
wreq = { version = "0.16", features = ["gzip", "deflate", "zstd", "brotli", "json", "cookies", "socks", "ws"] }
# Solo para el WebSocket del login por QR (src/discord/websocket.rs,
# `connect_qr`): `remote-auth-gateway.discord.gg` devolvía 403 con todas las
# variantes de wreq (con/sin emulación, con/sin Origin) y con tokio-tungstenite
# + rustls funcionaba. La versión coincide con la que ya trae wreq (0.29); el
# proveedor criptográfico de rustls en este proyecto es `ring` (única opción
# en Cargo.lock), así que `ClientConfig::builder()` no necesita configuración.
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
# Misma versión que usa vendor/discord_client_rest: websocket.rs arma la misma emulación
# (Chrome149 / Windows) para que REST y WebSockets se vean como un solo navegador.
wreq-util = "0.2"

# --- Llamadas de voz (src/discord/voice/, portado de concord) ---
# Cifrado RTP de extremo a extremo del canal de voz.
aes-gcm = "0.11"
chacha20poly1305 = "0.11"
# DAVE (Discord's end-to-end encryption for calls); requerido por Discord
# para conectar a un canal de voz.
davey = "0.1.4"
# Socket UDP crudo del transporte de voz (discovery + envío/recepción RTP).
socket2 = "0.6"
# Captura/reproducción de audio del micrófono y los parlantes.
cpal = { version = "0.18", optional = true, features = ["pulseaudio", "realtime"] }
# Supresión de ruido del micrófono (ajuste "Reducir ruido de fondo").
nnnoiseless = { version = "0.5", default-features = false, optional = true }
# Cancelación de eco (WebRTC AEC3, puro Rust) usada por voice/noise/echo.rs:
# resta del micrófono lo que suena por los parlantes.
sonora = { version = "0.2.0", optional = true }

# --- Adjuntar archivos (src/ui/attachments.rs) ---
# Selector de archivos nativo del SO (botón "+" del compositor).
rfd = "0.15"
# Pegar una captura / imagen del portapapeles como adjunto (Ctrl+V).
arboard = "3"

# --- Actualizaciones automáticas (src/updater.rs) ---
# De fastframe (github.com/crmne/fastframe, MIT), fijado a un commit. Busca versiones
# en los releases de GitHub, verifica la firma Ed25519 y el SHA-256, y
# reemplaza el ejecutable con un ayudante que restaura la anterior si la
# nueva no arranca. `reqwest` = el transporte sobre reqwest 0.12 blocking
# (el cliente de arriba ya lo compila con rustls y proxy del sistema).
fastframe-update = { git = "https://github.com/crmne/fastframe", rev = "491f7194d555578bf75e2ce9706b2b2b4d42cf31", features = ["reqwest"] }

# --- Notificaciones de escritorio (src/lib/notifications.rs) ---
# Notificación nativa del SO (D-Bus en Linux, centro de notificaciones en
# Windows/macOS) para cuando llega una mención/DM con la ventana sin foco.
notify-rust = "4"

[target.'cfg(all(target_arch = "arm", target_os = "linux"))'.dependencies]
opus = { version = "1.6.1", package = "opusic-c", features = ["no-simd"] }

[target.'cfg(not(all(target_arch = "arm", target_os = "linux")))'.dependencies]
opus = { version = "1.6.1", package = "opusic-c" }

[target.'cfg(target_os = "linux")'.dependencies]
alsa = { version = "0.11", optional = true }

# --- Perfiles de compilación ---
# Release: binario más chico y rápido. `lto = "thin"` + `codegen-units = 1`
# alcanzan casi todo el beneficio de LTO completo con un tiempo de link
# razonable (este proyecto arrastra egui, ffmpeg, wry, reqwest y wreq).
# No se usa `panic = "abort"`: varios hilos de fondo (audio, captura, gateway)
# dependen de que un panic quede contenido en su hilo.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

# Dev: las dependencias pesadas (egui, image, decodificación de video/audio,
# DSP de ruido/eco) corren con optimizaciones, porque en debug sin optimizar
# la UI y la reproducción de video van muy lentas. Tu propio código sigue en
# opt-level 0 para que compilar y depurar sea rápido.
[profile.dev.package."*"]
opt-level = 3

[profile.release-fast]
inherits = "release"
lto = "off"
codegen-units = 16

[features]
default = ["voice-playback"]
# Captura/reproducción real de audio de voz (micrófono y parlantes). Sin
# este feature, el cliente igual puede unirse a canales de voz y ver quién
# está hablando, pero no transmite ni reproduce audio (útil para compilar
# en una plataforma sin `cpal`/ALSA andando, o para un build más liviano).
voice-playback = ["dep:cpal", "dep:alsa", "dep:nnnoiseless", "dep:sonora"]

# system_fonts.rs: lee el idioma de la UI de Windows para elegir la variante
# de fuente CJK correcta.
[target.'cfg(windows)'.dependencies]
# `Win32_Graphics_Dwm` y `Win32_System_Threading`: voice/window_list.rs (lista de
# ventanas del selector de "Compartir pantalla": ventanas ocultas por DWM,
# proceso dueño y nombre del ejecutable). `Win32_Graphics_Gdi` y `Win32_Storage_Xps`:
# voice/source_thumbs.rs (miniaturas con PrintWindow/StretchBlt) y la lista de
# pantallas (EnumDisplayMonitors).
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Storage_Xps", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
# voice/window_capture.rs: captura de una ventana con Windows Graphics Capture
# (WGC) + Direct3D 11 para leer los cuadros. Reemplaza al `gdigrab title=...`.
windows = { version = "0.61", features = [
    "Foundation",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_WindowsAndMessaging",
] }

# --- Compilación del proto de settings de Discord (build.rs) ---
[build-dependencies]
prost-build = "0.13"
# Trae un binario de `protoc` prearmado para la plataforma del que
# compila, así `build.rs` no depende de tener `protoc` instalado a mano.
protoc-bin-vendored = "3"

# Incrusta assets/packaging/icon.ico en el .exe (ícono del acceso directo).
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

# --- Paquete .deb (cargo deb) ---
[package.metadata.deb]
name = "ecord"
maintainer = "example@example.com"
copyright = "2026, eCord contributors"
license-file = ["LICENSE", "0"]
extended-description = "Cliente de Discord no oficial escrito en Rust con egui."
section = "net"
priority = "optional"
# $auto = dpkg-shlibdeps mira las .so que usa el binario (FFmpeg, WebKitGTK,
# ALSA, Pulse...) y arma el Depends con los nombres correctos de la distro.
depends = "$auto"
assets = [
  ["target/release/ecord", "usr/bin/", "755"],
  ["packaging/linux/ecord.desktop", "usr/share/applications/", "644"],
  ["assets/packaging/icon-256.png", "usr/share/icons/hicolor/256x256/apps/ecord.png", "644"],
  ["THIRD_PARTY_NOTICES.md", "usr/share/doc/ecord/", "644"],
  ["assets/fonts/Inter-LICENSE.txt", "usr/share/doc/ecord/licenses/Inter-LICENSE.txt", "644"],
  ["assets/fonts/NotoEmoji-LICENSE.txt", "usr/share/doc/ecord/licenses/NotoEmoji-LICENSE.txt", "644"],
  ["assets/icons/LICENSE.txt", "usr/share/doc/ecord/licenses/Lucide-LICENSE.txt", "644"],
]

# Variante con FFmpeg incluido (la usa el CI): `cargo deb --variant bundled`.
# Necesita packaging/linux/ffmpeg-libs/ con las .so (el CI las prepara).
# Sin --variant, `cargo deb` usa el FFmpeg del sistema (bloque de arriba).
[package.metadata.deb.variants.bundled]
assets = [
  ["target/release/ecord", "usr/bin/", "755"],
  ["packaging/linux/ecord.desktop", "usr/share/applications/", "644"],
  ["assets/packaging/icon-256.png", "usr/share/icons/hicolor/256x256/apps/ecord.png", "644"],
  ["THIRD_PARTY_NOTICES.md", "usr/share/doc/ecord/", "644"],
  ["assets/fonts/Inter-LICENSE.txt", "usr/share/doc/ecord/licenses/Inter-LICENSE.txt", "644"],
  ["assets/fonts/NotoEmoji-LICENSE.txt", "usr/share/doc/ecord/licenses/NotoEmoji-LICENSE.txt", "644"],
  ["assets/icons/LICENSE.txt", "usr/share/doc/ecord/licenses/Lucide-LICENSE.txt", "644"],
  ["packaging/linux/ffmpeg-libs/*", "usr/lib/ecord/", "755"],
  ["packaging/linux/ffmpeg-LICENSE.txt", "usr/share/doc/ecord/ffmpeg-LICENSE.txt", "644"],
]

# --- Instaladores (.msi/.exe/.dmg) con cargo-packager ---
# Uso: cargo packager --release --formats wix,nsis   (Windows)
#      cargo packager --release --formats dmg        (macOS)
[package.metadata.packager]
product-name = "eCord"
identifier = "dev.ecord.client"
description = "Cliente de Discord no oficial hecho en Rust con egui"
authors = ["eCord contributors"]
license-file = "LICENSE"
category = "SocialNetworking"
out-dir = "dist-installers"
binaries-dir = "target/release"
binaries = [{ path = "ecord", main = true }]
# cargo-packager elige el ícono que corresponde a cada sistema.
icons = ["assets/packaging/icon.ico", "assets/packaging/icon.icns", "assets/packaging/icon.png"]
# DLLs (Windows) o dylibs (macOS) que el CI copia aquí antes de empaquetar.
resources = [{ src = "packaging/bundle-libs/*", target = "." }]

# --- wreq / wreq-util desde la rama principal de GitHub ---
# `[patch.crates-io]` reemplaza esos crates en TODO el grafo (este crate y
# vendor/discord_client_*), así que hay una sola copia de wreq y los tipos
# (Client, Emulation, WebSocket) coinciden. Los `Cargo.toml` de cada crate
# siguen pidiendo `wreq = "0.16"` / `wreq-util = "0.2"`: el patch tiene que
# cumplir esos requisitos. Para volver a las versiones publicadas, borrá
# esta sección. wreq y wreq-util están fijados a un commit exacto (`rev`);
# para actualizarlos, cambiá el hash. btls/btls-sys siguen en `main` (Cargo.lock
# fija el commit que resolvió cargo).
# btls/btls-sys: wreq (main) los parchea igual desde git; hay que repetirlo
# acá porque los `[patch]` de un dependiente no se aplican.
[patch.crates-io]
wreq = { git = "https://github.com/0x676e67/wreq", rev = "1e0e270d7f4570e1d3d69f60341d7255bc6fac18" }
wreq-util = { git = "https://github.com/0x676e67/wreq-util", rev = "5715529002738f46eea86a7271f918f9374d3582" }
btls = { git = "https://github.com/0x676e67/btls", branch = "main" }
btls-sys = { git = "https://github.com/0x676e67/btls", branch = "main" }
